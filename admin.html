<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>बाईसा का श्रृंगार | Admin Panel</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, "Noto Sans Devanagari", sans-serif;
      background: #fff8f1;
      color: #4b1025;
    }

    /* TOP BAR */
    .topbar {
      background: #70002d;
      color: white;
      padding: 18px 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 3px 12px rgba(0,0,0,0.15);
    }

    .brand {
      font-size: 23px;
      font-weight: bold;
    }

    .brand small {
      display: block;
      font-size: 11px;
      font-weight: normal;
      opacity: .85;
      margin-top: 3px;
    }

    .admin-badge {
      background: rgba(255,255,255,.15);
      padding: 9px 15px;
      border-radius: 20px;
      font-size: 13px;
    }

    /* MAIN */
    .container {
      width: 94%;
      max-width: 1250px;
      margin: 30px auto;
    }

    .heading {
      margin-bottom: 25px;
    }

    .heading h1 {
      font-size: 28px;
      margin-bottom: 7px;
    }

    .heading p {
      color: #777;
      font-size: 14px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    .card {
      background: white;
      border: 1px solid #ead7c8;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 5px 20px rgba(80,20,20,.07);
    }

    .card h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #70002d;
    }

    /* FORM */
    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 13px;
      border: 1px solid #dfc8b7;
      border-radius: 9px;
      background: #fffdfb;
      font-size: 14px;
      outline: none;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #9a1749;
      box-shadow: 0 0 0 2px rgba(154,23,73,.08);
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    /* PHOTO */
    .photo-upload-box {
      border: 2px dashed #c89052;
      border-radius: 13px;
      min-height: 220px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: #fffaf4;
      cursor: pointer;
      overflow: hidden;
      padding: 15px;
    }

    .photo-upload-box:hover {
      background: #fff5e9;
    }

    .upload-content {
      cursor: pointer;
      width: 100%;
    }

    .camera {
      font-size: 48px;
      margin-bottom: 10px;
    }

    .upload-title {
      display: block;
      color: #70002d;
      font-size: 17px;
      font-weight: bold;
    }

    .upload-subtitle {
      display: block;
      color: #888;
      font-size: 12px;
      margin-top: 6px;
    }

    #photoPreview {
      display: none;
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      border-radius: 10px;
    }

    /* BUTTON */
    .btn {
      border: none;
      border-radius: 9px;
      padding: 12px 18px;
      cursor: pointer;
      font-weight: bold;
      font-size: 14px;
    }

    .btn-primary {
      background: #70002d;
      color: white;
      width: 100%;
    }

    .btn-primary:hover {
      background: #92003d;
    }

    .btn-add {
      background: #a96b1d;
      color: white;
    }

    .btn-delete {
      background: #8e123b;
      color: white;
      padding: 7px 11px;
      font-size: 12px;
    }

    /* CATEGORY */
    .category-add {
      display: flex;
      gap: 8px;
      margin-bottom: 15px;
    }

    .category-add input {
      flex: 1;
    }

    .category-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .category-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #ead7c8;
      background: #fffaf6;
      padding: 10px 12px;
      border-radius: 9px;
      font-size: 14px;
    }

    /* PRODUCTS */
    .products-card {
      margin-top: 25px;
    }

    .products-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 18px;
    }

    .product-count {
      background: #70002d;
      color: white;
      border-radius: 20px;
      padding: 6px 12px;
      font-size: 12px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .product {
      border: 1px solid #ead7c8;
      border-radius: 12px;
      overflow: hidden;
      background: white;
    }

    .product-image {
      width: 100%;
      height: 180px;
      object-fit: cover;
      background: #f6eee8;
    }

    .product-info {
      padding: 12px;
    }

    .product-name {
      font-weight: bold;
      margin-bottom: 6px;
    }

    .product-meta {
      font-size: 12px;
      color: #777;
      line-height: 1.6;
    }

    .product-price {
      color: #70002d;
      font-weight: bold;
      font-size: 17px;
      margin: 8px 0;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #888;
      border: 1px dashed #ddc9bb;
      border-radius: 12px;
    }

    /* MESSAGE */
    #message {
      position: fixed;
      right: 20px;
      bottom: 20px;
      background: #70002d;
      color: white;
      padding: 13px 18px;
      border-radius: 9px;
      display: none;
      z-index: 1000;
      box-shadow: 0 5px 20px rgba(0,0,0,.2);
    }

    /* MOBILE */
    @media (max-width: 900px) {
      .dashboard {
        grid-template-columns: 1fr;
      }

      .products-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .topbar {
        padding: 15px;
      }

      .brand {
        font-size: 18px;
      }

      .container {
        width: 92%;
      }

      .products-grid {
        grid-template-columns: 1fr;
      }

      .category-add {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="brand">
      👑 बाईसा का श्रृंगार
      <small>Private Admin Panel</small>
    </div>

    <div class="admin-badge">
      🔒 Admin Control
    </div>
  </header>


  <main class="container">

    <div class="heading">
      <h1>Admin Dashboard</h1>
      <p>यहाँ से आप Jewellery Products और Categories को manage कर सकते हैं।</p>
    </div>


    <section class="dashboard">

      <!-- ADD PRODUCT -->
      <div class="card">

        <h2>📦 नया सामान जोड़ें</h2>

        <form id="productForm">

          <!-- PHOTO -->
          <div class="form-group">
            <label>Product Photo</label>

            <div class="photo-upload-box"
                 onclick="document.getElementById('productPhoto').click()">

              <div class="upload-content" id="uploadContent">

                <div class="camera">📷</div>

                <span class="upload-title">
                  Photo Upload करें
                </span>

                <span class="upload-subtitle">
                  नई ज्वेलरी की फोटो चुनें
                </span>

              </div>

              <img
                id="photoPreview"
                src=""
                alt="Product Preview"
              >

            </div>

            <input
              type="file"
              id="productPhoto"
              accept="image/*"
              style="display:none;"
            >
          </div>


          <!-- NAME -->
          <div class="form-group">
            <label for="productName">
              सामान का नाम
            </label>

            <input
              type="text"
              id="productName"
              placeholder="जैसे Royal Bridal Haar"
              required
            >
          </div>


          <!-- CATEGORY -->
          <div class="form-group">
            <label for="productCategory">
              Category
            </label>

            <select id="productCategory" required>
            </select>
          </div>


          <!-- METAL -->
          <div class="form-group">
            <label for="productMetal">
              Metal
            </label>

            <select id="productMetal">
              <option value="Gold">🥇 Gold</option>
              <option value="Silver">⚪ Silver</option>
            </select>
          </div>


          <!-- PRICE -->
          <div class="form-group">
            <label for="productPrice">
              Price
            </label>

            <input
              type="number"
              id="productPrice"
              placeholder="399"
              min="0"
              required
            >
          </div>


          <!-- DESCRIPTION -->
          <div class="form-group">
            <label for="productDescription">
              Description
            </label>

            <textarea
              id="productDescription"
              placeholder="Product की जानकारी लिखें..."
            ></textarea>
          </div>


          <button
            type="submit"
            class="btn btn-primary"
          >
            ➕ Product Add करें
          </button>

        </form>

      </div>


      <!-- CATEGORY MANAGEMENT -->
      <div class="card">

        <h2>📂 Category Management</h2>

        <div class="category-add">

          <input
            type="text"
            id="newCategory"
            placeholder="जैसे नाक की नथ"
          >

          <button
            class="btn btn-add"
            onclick="addCategory()"
          >
            + Add
          </button>

        </div>

        <div
          id="categoryList"
          class="category-list"
        ></div>

      </div>

    </section>


    <!-- PRODUCTS -->
    <section class="card products-card">

      <div class="products-header">

        <h2>
          📋 मेरे Products
        </h2>

        <span
          id="productCount"
          class="product-count"
        >
          0 Products
        </span>

      </div>

      <div
        id="productsGrid"
        class="products-grid"
      ></div>

    </section>

  </main>


  <div id="message"></div>


  <script>

    /* =========================================
       DEFAULT CATEGORIES
    ========================================= */

    const defaultCategories = [
      "हार",
      "कड़े",
      "अंगूठियाँ",
      "माथा पट्टी",
      "पायल",
      "नथ",
      "गिफ्ट आइटम"
    ];


    /* =========================================
       GET DATA
    ========================================= */

    let categories =
      JSON.parse(localStorage.getItem("baisa_categories")) ||
      defaultCategories;

    let products =
      JSON.parse(localStorage.getItem("baisa_products")) ||
      [];


    /* =========================================
       SAVE DATA
    ========================================= */

    function saveCategories() {

      localStorage.setItem(
        "baisa_categories",
        JSON.stringify(categories)
      );

    }


    function saveProducts() {

      localStorage.setItem(
        "baisa_products",
        JSON.stringify(products)
      );

    }


    /* =========================================
       MESSAGE
    ========================================= */

    function showMessage(text) {

      const message =
        document.getElementById("message");

      message.innerText = text;

      message.style.display = "block";

      setTimeout(() => {
        message.style.display = "none";
      }, 2500);

    }


    /* =========================================
       CATEGORY DROPDOWN
    ========================================= */

    function renderCategoryDropdown() {

      const select =
        document.getElementById("productCategory");

      select.innerHTML = "";

      categories.forEach(category => {

        const option =
          document.createElement("option");

        option.value = category;
        option.textContent = category;

        select.appendChild(option);

      });

    }


    /* =========================================
       CATEGORY LIST
    ========================================= */

    function renderCategories() {

      const list =
        document.getElementById("categoryList");

      list.innerHTML = "";

      categories.forEach((category, index) => {

        const div =
          document.createElement("div");

        div.className = "category-item";

        div.innerHTML = `
          <span>📁 ${escapeHTML(category)}</span>

          <button
            class="btn btn-delete"
            onclick="deleteCategory(${index})"
          >
            Delete
          </button>
        `;

        list.appendChild(div);

      });

    }


    /* =========================================
       ADD CATEGORY
    ========================================= */

    function addCategory() {

      const input =
        document.getElementById("newCategory");

      const name =
        input.value.trim();

      if (!name) {

        alert("पहले Category का नाम लिखें।");

        return;
      }


      if (
        categories.some(
          c => c.toLowerCase() === name.toLowerCase()
        )
      ) {

        alert("यह Category पहले से मौजूद है।");

        return;
      }


      categories.push(name);

      saveCategories();

      input.value = "";

      renderCategories();

      renderCategoryDropdown();

      showMessage("✅ नई Category जोड़ दी गई।");

    }


    /* =========================================
       DELETE CATEGORY
    ========================================= */

    function deleteCategory(index) {

      if (categories.length <= 1) {

        alert("कम से कम एक Category रहनी चाहिए।");

        return;
      }


      const name = categories[index];

      const used =
        products.some(
          product => product.category === name
        );


      if (used) {

        alert(
          "इस Category में Product मौजूद है। पहले उस Product को हटाएँ।"
        );

        return;
      }


      if (
        !confirm(
          `"${name}" Category delete करनी है?`
        )
      ) {

        return;
      }


      categories.splice(index, 1);

      saveCategories();

      renderCategories();

      renderCategoryDropdown();

      showMessage("🗑️ Category delete हो गई।");

    }


    /* =========================================
       PHOTO UPLOAD
    ========================================= */

    const productPhoto =
      document.getElementById("productPhoto");

    const photoPreview =
      document.getElementById("photoPreview");

    const uploadContent =
      document.getElementById("uploadContent");


    productPhoto.addEventListener(
      "change",
      function () {

        const file = this.files[0];

        if (!file) {

          photoPreview.style.display = "none";

          uploadContent.style.display = "block";

          return;
        }


        if (!file.type.startsWith("image/")) {

          alert("कृपया केवल Photo चुनें।");

          this.value = "";

          return;
        }


        const reader =
          new FileReader();


        reader.onload = function(event) {

          photoPreview.src =
            event.target.result;

          photoPreview.style.display =
            "block";

          uploadContent.style.display =
            "none";

        };


        reader.readAsDataURL(file);

      }
    );


    /* =========================================
       ADD PRODUCT
    ========================================= */

    document
      .getElementById("productForm")
      .addEventListener(
        "submit",
        function(event) {

          event.preventDefault();


          if (!productPhoto.files[0]) {

            alert("पहले Product की Photo चुनें।");

            return;
          }


          const product = {

            id:
              Date.now(),

            name:
              document
                .getElementById("productName")
                .value
                .trim(),

            category:
              document
                .getElementById("productCategory")
                .value,

            metal:
              document
                .getElementById("productMetal")
                .value,

            price:
              Number(
                document
                  .getElementById("productPrice")
                  .value
              ),

            description:
              document
                .getElementById("productDescription")
                .value
                .trim(),

            image:
              photoPreview.src,

            createdAt:
              new Date().toISOString()

          };


          products.unshift(product);

          saveProducts();

          renderProducts();


          /* RESET */

          document
            .getElementById("productForm")
            .reset();

          photoPreview.src = "";

          photoPreview.style.display =
            "none";

          uploadContent.style.display =
            "block";


          showMessage(
            "✅ Product सफलतापूर्वक Add हो गया।"
          );

        }
      );


    /* =========================================
       RENDER PRODUCTS
    ========================================= */

    function renderProducts() {

      const grid =
        document.getElementById("productsGrid");

      const count =
        document.getElementById("productCount");


      count.innerText =
        `${products.length} Products`;


      grid.innerHTML = "";


      if (products.length === 0) {

        grid.innerHTML = `
          <div class="empty" style="grid-column:1/-1;">
            अभी कोई Product Add नहीं किया गया है।
          </div>
        `;

        return;
      }


      products.forEach(product => {

        const div =
          document.createElement("div");

        div.className = "product";


        div.innerHTML = `

          <img
            class="product-image"
            src="${product.image}"
            alt="${escapeHTML(product.name)}"
          >

          <div class="product-info">

            <div class="product-name">
              ${escapeHTML(product.name)}
            </div>

            <div class="product-meta">
              📂 ${escapeHTML(product.category)}
              <br>
              ${product.metal === "Gold"
                ? "🥇 Gold"
                : "⚪ Silver"
              }
            </div>

            <div class="product-price">
              ₹${Number(product.price).toLocaleString("en-IN")}
            </div>

            <div class="product-meta">
              ${escapeHTML(product.description || "कोई Description नहीं")}
            </div>

            <br>

            <button
              class="btn btn-delete"
              onclick="deleteProduct(${product.id})"
            >
              🗑️ Delete Product
            </button>

          </div>

        `;


        grid.appendChild(div);

      });

    }


    /* =========================================
       DELETE PRODUCT
    ========================================= */

    function deleteProduct(id) {

      const product =
        products.find(
          p => p.id === id
        );


      if (!product) return;


      if (
        !confirm(
          `"${product.name}" को delete करना है?`
        )
      ) {

        return;
      }


      products =
        products.filter(
          p => p.id !== id
        );


      saveProducts();

      renderProducts();

      showMessage(
        "🗑️ Product delete हो गया।"
      );

    }


    /* =========================================
       HTML SECURITY
    ========================================= */

    function escapeHTML(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    /* =========================================
       INITIAL LOAD
    ========================================= */

    saveCategories();

    renderCategories();

    renderCategoryDropdown();

    renderProducts();

  </script>

</body>
</html>
